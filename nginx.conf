server {
    listen 80;
    listen 443 ssl http2;
    listen [::]:80;
    listen [::]:443 ssl http2;
    server_name kaiyueshangmao.xyz;

    # ============================================
    # SSL证书配置
    # ============================================
    ssl_certificate /www/server/panel/vhost/cert/dingyangmall-admin/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/dingyangmall-admin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 用于 SPA 回退的内部跳转
    error_page 418 = @spa_fallback;

    # 用于 SPA 回退的内部跳转
    error_page 418 = @spa_fallback;

    # HTTP自动跳转HTTPS
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    # ============================================
    # 1. 静态资源
    # ============================================
    
    # 前端路由处理 - 处理 /member/xxx、/activity/xxx 等前端路由刷新
    # 使用 ^~ 确保优先于通用 API 规则
    location ^~ /member/ {
        root /www/wwwroot/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
    
    location ^~ /activity/ {
        root /www/wwwroot/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
    
    # 根路径和其他静态资源
    location / {
        root /www/wwwroot/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 缓存静态资源
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # SPA 回退（供 GET /mall/banner 等页面刷新使用）
    location @spa_fallback {
        root /www/wwwroot/frontend/dist;
        try_files /index.html =404;
    }

    # ============================================
    # 2. 后端API代理 - 通用规则
    # ============================================
    
    # 通用代理参数
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;

    # 系统管理API
    location ^~ /system/ {
        proxy_pass http://127.0.0.1:7500/system/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 监控API
    location ^~ /monitor/ {
        proxy_pass http://127.0.0.1:7500/monitor/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 工具API
    location ^~ /tool/ {
        proxy_pass http://127.0.0.1:7500/tool/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 通用API
    location ^~ /common/ {
        proxy_pass http://127.0.0.1:7500/common/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 微信小程序API
    location ^~ /weixin/ {
        proxy_pass http://127.0.0.1:7500/weixin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 小程序新版 API（项目中大量 Controller 直接挂在 /api/ma/**）
    location ^~ /api/ma/ {
        proxy_pass http://127.0.0.1:7500/api/ma/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 小程序公开 API（无需 token）
    location ^~ /api/public/ma/ {
        proxy_pass http://127.0.0.1:7500/api/public/ma/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 商家移动端 API
    location ^~ /api/mall/merchant/ {
        proxy_pass http://127.0.0.1:7500/api/mall/merchant/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App会员端API
    location ^~ /app/ {
        proxy_pass http://127.0.0.1:7500/app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 商城API（精确匹配，避免与前端路由冲突）
    location = /mall/banner {
        if ($request_method ~* ^(GET|HEAD)$) { return 418; }
        proxy_pass http://127.0.0.1:7500/mall/banner;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /mall/banner/ {
        proxy_pass http://127.0.0.1:7500/mall/banner/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /mall/coupon {
        if ($request_method ~* ^(GET|HEAD)$) { return 418; }
        proxy_pass http://127.0.0.1:7500/mall/coupon;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /mall/coupon/ {
        proxy_pass http://127.0.0.1:7500/mall/coupon/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /mall/lottery {
        if ($request_method ~* ^(GET|HEAD)$) { return 418; }
        proxy_pass http://127.0.0.1:7500/mall/lottery;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /mall/lottery/ {
        proxy_pass http://127.0.0.1:7500/mall/lottery/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /mall/member {
        if ($request_method ~* ^(GET|HEAD)$) { return 418; }
        proxy_pass http://127.0.0.1:7500/mall/member;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /mall/member/ {
        proxy_pass http://127.0.0.1:7500/mall/member/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前端路由 - /mall/xxx（除了上面的API路径）
    location ^~ /mall/ {
        root /www/wwwroot/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # ============================================
    # 3. 商城独立API（无 /mall/ 前缀的）
    # ============================================
    location ^~ /goodscategory {
        proxy_pass http://127.0.0.1:7500/goodscategory;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location ^~ /goodsspu {
        proxy_pass http://127.0.0.1:7500/goodsspu;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location ^~ /orderinfo {
        proxy_pass http://127.0.0.1:7500/orderinfo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /integralflow {
        proxy_pass http://127.0.0.1:7500/integralflow;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /integralrule {
        proxy_pass http://127.0.0.1:7500/integralrule;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 微信相关API
    location ^~ /wxuser {
        proxy_pass http://127.0.0.1:7500/wxuser;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /wxmsg {
        proxy_pass http://127.0.0.1:7500/wxmsg;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /wxmenu {
        proxy_pass http://127.0.0.1:7500/wxmenu;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /wxmaterial {
        proxy_pass http://127.0.0.1:7500/wxmaterial;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /wxsummary {
        proxy_pass http://127.0.0.1:7500/wxsummary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /wxusertags {
        proxy_pass http://127.0.0.1:7500/wxusertags;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 登录相关
    location ^~ /login {
        proxy_pass http://127.0.0.1:7500/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /logout {
        proxy_pass http://127.0.0.1:7500/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /getInfo {
        proxy_pass http://127.0.0.1:7500/getInfo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /captchaImage {
        proxy_pass http://127.0.0.1:7500/captchaImage;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============================================
    # 4. 文件上传目录
    # ============================================
    location ^~ /profile/file/ {
        proxy_pass http://127.0.0.1:7500/profile/file/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /profile/ {
        alias /www/wwwroot/dingyangmall/uploadPath/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /uploadPath/ {
        alias /www/wwwroot/dingyangmall/uploadPath/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ============================================
    # 5. 安全相关
    # ============================================
    location ~* \.(user.ini|htaccess|htpasswd|env|git|svn)$ {
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # ============================================
    # 6. 日志
    # ============================================
    access_log /www/wwwlogs/dingyangmall-access.log;
    error_log /www/wwwlogs/dingyangmall-error.log;
}
